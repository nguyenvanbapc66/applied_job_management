<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bàn săn job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Bàn săn job">
  <meta name="theme-color" content="#e7ecf0">
</head>
<body data-auth="loading">
  <main class="login" aria-labelledby="loginTitle">
    <form id="loginForm" class="login-card">
      <h1 id="loginTitle"><img src="favicon.svg" alt="" width="40" height="40">Bàn săn job</h1>
      <p>Đăng nhập để xem và đồng bộ danh sách job.</p>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="login-error" id="loginError" role="alert"></p>
      <button class="btn primary">Đăng nhập</button>
    </form>
  </main>

  <div class="app">
  <nav class="appbar">
    <span class="brand"><img src="favicon.svg" alt="" width="28" height="28">Bàn săn job</span>
    <span class="sync" id="sync" data-state="ok" role="status">Đã đồng bộ</span>
    <button class="btn ghost" id="logoutBtn">Đăng xuất</button>
  </nav>
  <header class="today">
    <div>
      <p class="today-date"><span id="todayDate"></span> <time class="clock" id="clock"></time></p>
      <h1 id="greeting"></h1>
      <ul class="agenda" id="agenda"></ul>
    </div>
    <figure class="week" aria-labelledby="weekCap">
      <ol id="week"></ol>
      <figcaption id="weekCap"></figcaption>
    </figure>
  </header>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Tìm công ty, vị trí…  ( / )" aria-label="Tìm job">
    <button class="btn ghost" id="exportBtn">Xuất file</button>
    <label class="btn ghost">Nhập file<input type="file" id="importInput" accept="application/json" hidden></label>
    <button class="btn primary" id="addBtn">Thêm job <kbd>N</kbd></button>
  </div>

  <main class="board" id="board"></main>
  </div>

  <dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
    <form id="jobForm" method="dialog">
      <header class="drawer-head">
        <span class="grabber" aria-hidden="true"></span>
        <h2 id="drawerTitle">Thêm job</h2>
        <button type="button" class="btn icon" data-close aria-label="Đóng">✕</button>
      </header>
      <div class="fields">
        <label>Công ty<input name="company" required autocomplete="off"></label>
        <label>Vị trí<input name="role" required autocomplete="off"></label>
        <fieldset class="stage-pick">
          <legend>Giai đoạn</legend>
          <div id="stagePick"></div>
        </fieldset>
        <section class="journey" aria-labelledby="journeyTitle">
          <h3 id="journeyTitle">Hành trình</h3>
          <div class="composer">
            <textarea id="noteText" rows="3" aria-label="Ghi chú cho bước hiện tại"></textarea>
            <div class="prompts" id="prompts"></div>
            <div class="composer-foot">
              <label class="note-date">Ngày<input type="date" id="noteDate"></label>
              <button type="button" class="btn" id="addNoteBtn" title="⌘ + Enter">Thêm ghi chú</button>
            </div>
          </div>
          <ol class="timeline" id="timeline"></ol>
        </section>
        <div class="row">
          <label>Ngày apply<input name="appliedDate" type="date"></label>
          <label>Địa điểm<input name="location" placeholder="Hà Nội · Remote"></label>
        </div>
        <label>Mức lương<input name="salary" placeholder="vd. 30–40 triệu"></label>
        <div class="url-field">
          <label>Link tin tuyển dụng<input name="url" type="url" placeholder="https://"></label>
          <a class="btn ghost" id="openUrl" target="_blank" rel="noopener noreferrer" hidden>Mở link</a>
        </div>
        <div class="next">
          <p>Bước tiếp theo</p>
          <div class="row">
            <label>Ngày<input name="nextDate" type="date"></label>
            <label>Việc cần làm<input name="nextNote" placeholder="Gửi email hỏi kết quả"></label>
          </div>
        </div>
        <label>Ghi chú chung<textarea name="notes" rows="3" placeholder="Thông tin không gắn với bước nào: người quen ở công ty, tech stack…"></textarea></label>
      </div>
      <footer class="drawer-foot">
        <button type="button" class="btn danger" id="deleteBtn">Xoá job</button>
        <button class="btn primary" value="save">Lưu</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
